name: Build on Merge to Main

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  build_docker_image_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract release version
        id: extract_version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          RELEASE_VERSION=$(echo "$COMMIT_MESSAGE" | grep -oP 'from \S+/release/\K\S+' | head -n1)
          if [ -z "$RELEASE_VERSION" ]; then
            echo "Could not extract release version (expected 'Merge pull request #N from <owner>/release/<version>' in the merge commit message)." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: OIDC token
        id: docker_oidc
        uses: docker/oidc-action@v1
        with:
          connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ssmcnetwork
          password: ${{ steps.docker_oidc.outputs.token }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ssmcnetwork/home-discord-bot:latest
            ssmcnetwork/home-discord-bot:${{ env.RELEASE_VERSION }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
